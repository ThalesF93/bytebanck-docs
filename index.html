<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteBank API Documentation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { background: #1a1a2e; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .topbar h1 { color: #fff; font-size: 20px; margin: 0; font-family: sans-serif; }
    .topbar select {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      background: #16213e;
      color: #fff;
      cursor: pointer;
    }
    .topbar select:focus { outline: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>💰 ByteBank API</h1>
    <select id="service-selector" onchange="loadService(this.value)">
      <option value="accounts.json">Accounts Service</option>
      <option value="customer.json">Customer Service</option>
      <option value="transactions.json">Transactions Service</option>
      <option value="notification.json">Notification Service</option>
      <option value="finance-ai.json">Finance AI Service</option>
    </select>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>
  <script>
    let ui;

    function loadService(url) {
      if (ui) {
        ui = SwaggerUIBundle({
          url: url,
          dom_id: '#swagger-ui',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'StandaloneLayout',
          deepLinking: true,
          defaultModelsExpandDepth: -1,
        });
      }
    }

    window.onload = function () {
      ui = SwaggerUIBundle({
        url: 'accounts.json',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
        deepLinking: true,
        defaultModelsExpandDepth: -1,
      });
    };
  </script>
</body>
</html>
